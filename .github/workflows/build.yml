name: Build Windows EXE

# Bouwt automatisch BJAssistant.exe en BJKalibreren.exe op een schone,
# door GitHub beheerde Windows-machine - dus zonder dat jouw eigen pc
# een werkende Python/tcl-tk-installatie nodig heeft.
#
# Draait bij elke push naar main, en is ook handmatig te starten via
# de "Actions" tab op GitHub (knop "Run workflow").

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Code uitchecken
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: .exe-bestanden bouwen
        run: pyinstaller build.spec --noconfirm

      - name: .exe-bestanden uploaden als download
        uses: actions/upload-artifact@v4
        with:
          name: BJAssistant-windows
          path: dist/*.exe
